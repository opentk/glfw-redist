name: OpenTK GLFW Redistributable
on:
  workflow_dispatch:
    inputs:
  push:
    branches:
      - master
      - develop
jobs:
  build:
    env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        
    runs-on: ubuntu-24.04
    container: debian:bullseye
    strategy:
      fail-fast: true

    steps:
    - name: Fixup apt sources
      run: |
        sed -i 's/deb.debian.org/archive.debian.org/g' /etc/apt/sources.list
        apt-get update
    - name: Install build dependencies
      run: |
        apt-get install -y curl wget git cmake xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules
    - name: Install powershell
      run: |
        VERSION_ID=$(awk -F= '/^VERSION_ID=/{gsub(/"/, "", $2); print $2}' /etc/os-release)
        wget -q https://packages.microsoft.com/config/debian/$VERSION_ID/packages-microsoft-prod.deb
        dpkg -i packages-microsoft-prod.deb
        apt-get update
        apt-get install -y powershell
    - name: "Disable git safe directories"
      run: |
        git config --global --add safe.directory '*'
    - uses: actions/checkout@v7
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Download dependencies and create Nuget Package
      run: ./make_nuget.ps1 "" ${{ github.run_number }}
      shell: pwsh
    - uses: actions/upload-artifact@v7
      with:
        name: NugetPackage
        path: ./artifacts/*.nupkg
    - name: Deploy Nuget Package
      run: dotnet nuget push ./artifacts/*.nupkg -k $NUGET_API_KEY -s https://api.nuget.org/v3/index.json
